name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege default: read-only access to repository contents
permissions:
  contents: read

jobs:
  lint:
    name: Lint Scripts & Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run ShellCheck on scripts
        run: shellcheck scripts/sysinfo.sh scripts/healthcheck.sh

      - name: Run Hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build container image with BUILD_SHA
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            -t devops-intern-final:${{ github.sha }} \
            app/

      - name: Save image archive for downstream jobs
        run: docker save devops-intern-final:${{ github.sha }} -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: /tmp/image.tar
          retention-days: 1

  test:
    name: Test Container Health
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      - name: Start container and run healthcheck
        run: |
          docker run -d --name ci-nginx-test -p 8080:8080 devops-intern-final:${{ github.sha }}
          echo "Waiting for container readiness..."
          for i in {1..10}; do
            if curl -s http://localhost:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          ./scripts/healthcheck.sh http://localhost:8080/healthz
          docker rm -f ci-nginx-test

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        run: |
          IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag devops-intern-final:${{ github.sha }} "${IMAGE_REPO}:${{ github.sha }}"
          docker tag devops-intern-final:${{ github.sha }} "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:${{ github.sha }}"
          docker push "${IMAGE_REPO}:latest"
